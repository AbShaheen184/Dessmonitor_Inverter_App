name: Build and Create Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APKs
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Prepare Artifacts
        run: |
          mkdir -p artifacts
          find app/build/outputs/apk -name "*.apk" -exec cp {} artifacts/ \;
          # Rename for clarity if needed, or just upload all
          mv artifacts/app-debug.apk artifacts/DessMonitor-SmartESS-debug.apk || true
          # Grab the first release APK found
          mv artifacts/app-release-unsigned.apk artifacts/DessMonitor-SmartESS-release.apk || mv artifacts/app-release.apk artifacts/DessMonitor-SmartESS-release.apk || true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-apks
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: artifacts/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
