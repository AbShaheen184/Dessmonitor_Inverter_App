name: Build and Create Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK & GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug & Release APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug assembleRelease --no-daemon
          else
            gradle assembleDebug assembleRelease --no-daemon
          fi

      - name: Prepare Release Artifacts
        run: |
          mkdir -p artifacts
          # Find and copy the debug APK
          find app/build/outputs/apk/debug -name "*.apk" -exec cp {} artifacts/DessMonitor-SmartESS-debug.apk \;
          # Find and copy the release APK (signed or unsigned)
          find app/build/outputs/apk/release -name "*.apk" -exec cp {} artifacts/DessMonitor-SmartESS-release.apk \;

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-apks
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: artifacts/*.apk
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('manual-{0}', github.run_number) }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || format('Manual Build #{0}', github.run_number) }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
